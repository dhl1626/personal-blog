<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签云</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%) !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .page-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 3rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .page-title {
            color: white;
            font-weight: 800;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }
        
        .tags-cloud-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
        }
        
        .tags-cloud-body {
            padding: 2.5rem;
        }
        
        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(17, 153, 142, 0.3);
            margin: 0.5rem;
        }
        
        .tag-item:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
            color: white;
            text-decoration: none;
        }
        
        .tag-item .badge-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        
        .tag-item i {
            font-size: 1.1rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #bdc3c7;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }
        
        .stats-bar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }
        
        .stats-number {
            font-size: 2.5rem;
            font-weight: 800;
        }
        
        .stats-label {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            background: white;
            border-radius: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: #f8f9fa;
            color: #11998e;
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .page-title {
                font-size: 1.75rem;
            }
            
            .tags-cloud-body {
                padding: 1.5rem;
            }
            
            .tag-item {
                font-size: 0.85rem;
                padding: 0.6rem 1rem;
            }
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/articles">
            <i class="bi bi-journal-bookmark-fill me-2"></i>博客系统
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles"><i class="bi bi-journal-text me-1"></i>博客列表</a>
            <a class="nav-link" href="/tags-cloud"><i class="bi bi-tags me-1"></i>标签云</a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="page-title"><i class="bi bi-tags me-2"></i>标签云</h1>
                <p class="page-subtitle mb-0">浏览所有标签，发现感兴趣的内容</p>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <!-- 统计信息 -->
            <div class="stats-bar">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="stats-number" th:text="${#lists.size(hotTags)}">0</div>
                        <div class="stats-label">
                            <i class="bi bi-hash me-2"></i>个热门标签
                        </div>
                    </div>
                </div>
            </div>
        
            <!-- 标签云卡片 -->
            <div class="tags-cloud-card">
                <div class="tags-cloud-body">
                    <!-- 空状态 -->
                    <div th:if="${#lists.isEmpty(hotTags)}" class="empty-state">
                        <i class="bi bi-tags"></i>
                        <h5 class="text-muted">暂无标签</h5>
                        <p class="text-muted mb-0">文章发布后，标签将在这里显示</p>
                    </div>
                    
                    <!-- 标签列表 -->
                    <div th:unless="${#lists.isEmpty(hotTags)}" class="text-center">
                        <a th:each="tag : ${hotTags}"
                           th:href="@{/articles?tag={name}(name=${tag.name})}"
                           class="tag-item"
                           th:title="${tag.name} + ' - ' + ${tag.articles.size()} + ' 篇文章'">
                            <i class="bi bi-hash"></i>
                            <span th:text="${tag.name}">标签名</span>
                            <span class="badge-count" th:text="${tag.articles.size()}">0</span>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- 底部导航 -->
            <div class="text-center mt-4">
                <a href="/articles" class="back-link">
                    <i class="bi bi-arrow-left"></i>
                    <span>返回博客列表</span>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
