<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 管理后台 - 数据看板</title>

    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4e73df;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fc;
            overflow-x: hidden;
        }

        /* ==================== 侧边栏样式 ==================== */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .sidebar-brand-icon {
            font-size: 1.5rem;
            color: white;
            margin-right: 0.75rem;
        }

        .sidebar-brand-text {
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .sidebar-brand-text:hover {
            color: white;
            text-decoration: none;
        }

        .sidebar-heading {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 1.5rem 1rem 0.5rem;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link i {
            margin-right: 0.75rem;
            font-size: 0.9rem;
        }

        /* ==================== 主内容区域 ==================== */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 0;
            transition: all 0.3s ease;
        }

        /* 顶部导航栏 */
        .topbar {
            height: 70px;
            background-color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .user-name {
            font-weight: 700;
            color: #5a5c69;
        }

        /* 页面内容 */
        .page-content {
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #5a5c69;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: #858796;
            font-size: 0.9rem;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            border-left: 4px solid;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.2);
        }

        .stat-card.primary { border-left-color: var(--primary-color); }
        .stat-card.success { border-left-color: var(--success-color); }
        .stat-card.info { border-left-color: var(--info-color); }
        .stat-card.warning { border-left-color: var(--warning-color); }

        .stat-card::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
            border-radius: 50%;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-card.primary .stat-label { color: var(--primary-color); }
        .stat-card.success .stat-label { color: var(--success-color); }
        .stat-card.info .stat-label { color: var(--info-color); }
        .stat-card.warning .stat-label { color: var(--warning-color); }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: #5a5c69;
            margin-bottom: 0.25rem;
        }

        .stat-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            opacity: 0.15;
        }

        /* 图表区域 */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e3e6f0;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4e73df;
            margin: 0;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* 最近文章表格 */
        .recent-articles-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }

        .table-responsive {
            border-radius: 10px;
            overflow: hidden;
        }

        .table thead th {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            border: none;
            padding: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-color: #e3e6f0;
        }

        .table tbody tr:hover {
            background-color: #f8f9fc;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.published {
            background-color: #d4edda;
            color: #155724;
        }

        .status-badge.draft {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-badge.archived {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-action {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 5px;
            margin: 0 0.25rem;
        }

        /* 标签云 */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-item {
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #f8f9fc 0%, #e3e6f0 100%);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #5a5c69;
            transition: all 0.3s ease;
        }

        .tag-item:hover {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
        }

        .tag-count {
            background: rgba(0,0,0,0.1);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.5rem;
            font-size: 0.75rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                margin-left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                margin-left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <a href="/admin/dashboard" class="sidebar-brand-text">
            <span class="sidebar-brand-icon">🎯</span>
            <span>博客管理后台</span>
        </a>
    </div>

    <div class="sidebar-heading">总览</div>
    <a href="/admin/dashboard" class="nav-link active">
        <i class="bi bi-speedometer2"></i>
        <span>数据看板</span>
    </a>
    <a href="/admin/articles" class="nav-link">
        <i class="bi bi-journal-text"></i>
        <span>文章管理</span>
    </a>

    <div class="sidebar-heading">内容</div>
    <a href="/admin/comments" class="nav-link">

    </a>
    <a href="/admin/categories" class="nav-link">

    </a>
    <a href="/admin/tags" class="nav-link">
        <i class="bi bi-tags"></i>
        <span>标签管理</span>
    </a>

    <div class="sidebar-heading">系统</div>
    <a href="/admin/users" class="nav-link">
        <i class="bi bi-people"></i>
        <span>用户管理</span>
    </a>
    <a href="/admin/roles" class="nav-link">
        <i class="bi bi-shield-lock"></i>
        <span>角色权限</span>
    </a>
    <a href="/admin/promote" class="nav-link">
        <i class="bi bi-person-plus"></i>
        <span>管理员设置</span>
    </a>

    <div class="sidebar-heading">返回</div>
    <a href="/articles" class="nav-link">
        <i class="bi bi-house-door"></i>
        <span>返回首页</span>

    <a href="/article/list" class="nav-link">
        <i class="bi bi-list-ul"></i>

<!-- 主内容区域 -->
<div class="main-content">
    <!-- 顶部导航栏 -->
    <div class="topbar">
        <button class="btn btn-link d-md-none" id="sidebarToggle">
            <i class="bi bi-list" style="font-size: 1.5rem; color: #5a5c69;"></i>
        </button>

        <div class="user-info">
            <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">U</div>
            <span class="user-name" th:text="${#authentication.name}">Admin</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>退出
            </a>
        </div>
    </div>

    <!-- 页面内容 -->
    <div class="page-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">📊 数据看板</h1>
            <p class="page-subtitle">实时监控博客运营数据，掌握最新动态</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card primary">
                <div class="stat-label">文章总数</div>
                <div class="stat-value" id="totalArticles">-</div>
                <i class="bi bi-journal-bookmark stat-icon"></i>
            </div>
            <div class="stat-card success">
                <div class="stat-label">总访问量</div>
                <div class="stat-value" id="totalViews">-</div>
                <i class="bi bi-eye stat-icon"></i>
            </div>
            <div class="stat-card info">
                <div class="stat-label">评论总数</div>
                <div class="stat-value" id="totalComments">-</div>
                <i class="bi bi-chat-quote stat-icon"></i>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">用户总数</div>
                <div class="stat-value" id="totalUsers">-</div>
                <i class="bi bi-people stat-icon"></i>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <!-- 访问趋势图 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">📈 访问趋势（最近 7 天）</h5>
                </div>
                <div class="chart-container">
                    <canvas id="viewTrendChart"></canvas>
                </div>
            </div>

            <!-- 分类分布图 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h5 class="chart-title">📁 分类文章分布</h5>
                </div>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 最近文章 -->
        <div class="recent-articles-card">
            <div class="chart-header">
                <h5 class="chart-title">📝 最近文章</h5>
                <a href="/admin/articles" class="btn btn-primary btn-sm">
                    查看全部 <i class="bi bi-arrow-right"></i>
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>作者</th>
                            <th>状态</th>
                            <th>访问量</th>
                            <th>评论</th>
                            <th>发布时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recentArticlesBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 热门标签 -->
        <div class="chart-card mt-4">
            <div class="chart-header">
                <h5 class="chart-title">🏷️ 热门标签</h5>
            </div>
            <div class="tag-cloud" id="tagCloud">
                <span class="tag-item">加载中...</span>
            </div>
        </div>
    </div>
</div>

<!-- 引入 Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// 全局变量
let viewTrendChartInstance = null;
let categoryChartInstance = null;

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', function() {
    // 加载看板数据
    loadDashboardData();

    // 侧边栏切换（移动端）
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('active');
    });
});

/**
 * 加载看板数据
 */
async function loadDashboardData() {
    try {
        const response = await fetch('/api/admin/dashboard', {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            },
            credentials: 'same-origin'
        });
        
        // 检查是否是 HTML 响应（未授权，重定向到登录页）
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('text/html')) {
            showAuthError();
            return;
        }
        
        if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
                showAuthError();
                return;
            }
            throw new Error('HTTP ' + response.status);
        }
        
        const data = await response.json();

        // 更新统计卡片
        document.getElementById('totalArticles').textContent = data.totalArticles || 0;
        document.getElementById('totalViews').textContent = data.totalViews || 0;
        document.getElementById('totalComments').textContent = data.totalComments || 0;
        document.getElementById('totalUsers').textContent = data.totalUsers || 0;

        // 更新最近文章列表
        updateRecentArticles(data.recentArticles);

        // 更新标签云
        updateTagCloud(data.tagStats);

        // 更新图表
        updateViewTrendChart(data.viewTrend);
        updateCategoryChart(data.categoryStats);

    } catch (error) {
        console.error('加载看板数据失败:', error);
        showError('加载数据失败：' + error.message + '，请刷新页面重试');
    }
}

/**
 * 显示未授权错误提示
 */
function showAuthError() {
    const errorMsg = '您没有权限访问此页面，请返回文章列表页';
    const content = document.querySelector('.page-content');
    if (content) {
        content.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: #e74a3b;"></i>
                <h3 class="mt-4" style="color: #5a5c69;">无权访问</h3>
                <p class="text-muted mt-2">${errorMsg}</p>
                <div class="mt-4">
                    <a href="/articles" class="btn btn-primary me-2">
                        <i class="bi bi-house-door me-1"></i>返回文章列表
                    </a>
                    <a href="/logout" class="btn btn-outline-secondary">
                        <i class="bi bi-box-arrow-right me-1"></i>退出登录
                    </a>
                </div>
            </div>
        `;
    }
}

/**
 * 更新最近文章列表
 */
function updateRecentArticles(articles) {
    const tbody = document.getElementById('recentArticlesBody');
    if (!articles || articles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">暂无文章</td></tr>';
        return;
    }

    tbody.innerHTML = articles.map(article => `
        <tr>
            <td style="max-width: 300px;">
                <div class="text-truncate" title="${escapeHtml(article.title)}">
                    ${escapeHtml(article.title)}
                </div>
            </td>
            <td>${escapeHtml(article.author)}</td>
            <td>
                <span class="status-badge ${article.status}">${getStatusText(article.status)}</span>
            </td>
            <td>${article.views || 0}</td>
            <td>${article.comments || 0}</td>
            <td>${article.createTime}</td>
            <td>
                <a href="/article/${article.id}" class="btn btn-action btn-primary" title="查看">
                    <i class="bi bi-eye"></i>
                </a>
                <a href="/article/edit/${article.id}" class="btn btn-action btn-warning" title="编辑">
                    <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-action btn-danger" onclick="toggleArticleStatus(${article.id})" title="切换状态">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

/**
 * 更新标签云
 */
function updateTagCloud(tagStats) {
    const tagCloud = document.getElementById('tagCloud');
    if (!tagStats || tagStats.length === 0) {
        tagCloud.innerHTML = '<span class="tag-item">暂无标签</span>';
        return;
    }

    tagCloud.innerHTML = tagStats.slice(0, 20).map(tag => `
        <a href="/tags/${encodeURIComponent(tag.name)}" class="tag-item" style="text-decoration: none;">
            ${escapeHtml(tag.name)}
            <span class="tag-count">${tag.articleCount}</span>
        </a>
    `).join('');
}

/**
 * 更新访问趋势图表
 */
function updateViewTrendChart(viewTrend) {
    const ctx = document.getElementById('viewTrendChart');
    if (!ctx || !viewTrend || viewTrend.length === 0) return;

    const labels = viewTrend.map(item => item.date);
    const data = viewTrend.map(item => item.views);

    if (viewTrendChartInstance) {
        viewTrendChartInstance.destroy();
    }

    viewTrendChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '访问量',
                data: data,
                borderColor: '#4e73df',
                backgroundColor: 'rgba(78, 115, 223, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointBackgroundColor: '#4e73df',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointRadius: 5,
                pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            }
        }
    });
}

/**
 * 更新分类分布图表
 */
function updateCategoryChart(categoryStats) {
    const ctx = document.getElementById('categoryChart');
    if (!ctx || !categoryStats || categoryStats.length === 0) return;

    const labels = categoryStats.map(item => item.name);
    const data = categoryStats.map(item => item.articleCount);

    if (categoryChartInstance) {
        categoryChartInstance.destroy();
    }

    categoryChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: [
                    '#4e73df', '#1cc88a', '#36b9cc', '#f6c23e',
                    '#e74a3b', '#858796', '#5a5c69', '#37b96f'
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        padding: 15,
                        font: {
                            size: 12
                        }
                    }
                }
            }
        }
    });
}

/**
 * 切换文章状态
 */
async function toggleArticleStatus(articleId) {
    if (!confirm('确定要切换这篇文章的状态吗？')) return;

    try {
        const response = await fetch(`/api/admin/articles/${articleId}/toggle-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();

        if (result.success) {
            showSuccess(result.message);
            loadDashboardData(); // 重新加载数据
        } else {
            showError(result.message);
        }
    } catch (error) {
        console.error('切换状态失败:', error);
        showError('操作失败，请重试');
    }
}

/**
 * 获取状态文本
 */
function getStatusText(status) {
    const statusMap = {
        'published': '已发布',
        'draft': '草稿',
        'archived': '已归档'
    };
    return statusMap[status] || status;
}

/**
 * HTML 转义
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/**
 * 显示成功提示
 */
function showSuccess(message) {
    alert('✅ ' + message);
}

/**
 * 显示错误提示
 */
function showError(message) {
    alert('❌ ' + message);
}
</script>
