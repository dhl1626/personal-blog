<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员设置 - 后台管理</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%) !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .page-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .page-title {
            color: white;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }
        
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }
        
        .sidebar-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
            height: fit-content;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem;
            color: white;
        }
        
        .sidebar-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .sidebar-menu {
            padding: 1rem 0;
        }
        
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .sidebar-link:hover {
            background: #f8f9fa;
            color: #667eea;
            border-left-color: #667eea;
            padding-left: 1.75rem;
        }
        
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
            border-left-color: #667eea;
        }
        
        .sidebar-link i {
            font-size: 1.2rem;
        }
        
        .content-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
        }
        
        .card-section {
            margin-bottom: 1.5rem;
        }
        
        .card-section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 2px solid #e8ecef;
        }
        
        .card-section-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card-section-header.bg-danger-custom {
            background: linear-gradient(135deg, #e74a3b 0%, #f5576c 100%);
            color: white;
            border-bottom: none;
        }
        
        .card-section-header.bg-success-custom {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-bottom: none;
        }
        
        .card-section-body {
            padding: 1.5rem;
        }
        
        .table-custom {
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .table-custom thead th {
            border: none;
            padding: 1rem 1.25rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }
        
        .table-custom tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e8ecef;
        }
        
        .table-custom tbody tr:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            transform: scale(1.005);
        }
        
        .table-custom tbody td {
            padding: 1rem 1.25rem;
            vertical-align: middle;
            color: #2c3e50;
        }
        
        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-name {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.05rem;
        }
        
        .user-username {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .form-select-custom {
            border-radius: 12px;
            border: 2px solid #e8ecef;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-select-custom:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 0.2rem rgba(17, 153, 142, 0.15);
            outline: none;
        }
        
        .btn-custom {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-custom-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(17, 153, 142, 0.3);
        }
        
        .btn-custom-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
            color: white;
        }
        
        .btn-custom-danger {
            background: linear-gradient(135deg, #e74a3b 0%, #f5576c 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(231, 74, 59, 0.3);
        }
        
        .btn-custom-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 74, 59, 0.4);
            color: white;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .alert-info-custom {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #bdc3c7;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }
        
        .current-user-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        @media (max-width: 992px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-gear-fill me-2"></i>后台管理
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles"><i class="bi bi-journal-text me-1"></i>博客列表</a>
            <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>注销</a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="page-title"><i class="bi bi-person-badge me-2"></i>管理员设置</h1>
                <p class="page-subtitle mb-0">管理系统管理员，提升或移除管理员身份</p>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="admin-layout">
        <!-- 左侧菜单 -->
        <div class="sidebar-card">
            <div class="sidebar-header">
                <h5><i class="bi bi-list-ul me-2"></i>管理菜单</h5>
            </div>
            <div class="sidebar-menu">
                <a href="/admin/roles" class="sidebar-link">
                    <i class="bi bi-shield-lock"></i>
                    <span>角色管理</span>
                </a>
                <a href="/admin/users" class="sidebar-link">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin/promote" class="sidebar-link active">
                    <i class="bi bi-person-badge"></i>
                    <span>管理员设置</span>
                </a>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="content-card">
            <!-- 当前管理员列表 -->
            <div class="card-section">
                <div class="card-section-header bg-danger-custom">
                    <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>当前管理员列表</h5>
                </div>
                <div class="card-section-body p-0">
                    <div th:if="${#lists.isEmpty(admins)}" class="empty-state">
                        <i class="bi bi-person-exclamation"></i>
                        <p class="mb-0">暂无管理员</p>
                    </div>
                    <div th:if="${!#lists.isEmpty(admins)}" class="table-responsive">
                        <table class="table-custom table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>管理员</th>
                                    <th>用户名</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="admin : ${admins}">
                                    <td>
                                        <span class="text-muted" th:text="${admin.id}">1</span>
                                    </td>
                                    <td>
                                        <div class="user-info">
                                            <div class="user-avatar">
                                                <span th:text="${#strings.toUpperCase(#strings.substring(admin.username, 0, 1))}">A</span>
                                            </div>
                                            <div>
                                                <div class="user-name" th:text="${admin.nickname}">管理员</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="user-username" th:text="${admin.username}">admin</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/admin/promote/remove}" method="post" class="d-inline">
                                            <input type="hidden" name="userId" th:value="${admin.id}">
                                            <button type="submit" class="btn btn-custom btn-custom-danger btn-sm"
                                                    th:if="${admin.id != currentUserId}"
                                                    onclick="return confirm('确定要移除该用户的管理员身份吗？');">
                                                <i class="bi bi-trash me-1"></i>移除管理员
                                            </button>
                                            <span th:if="${admin.id == currentUserId}" class="current-user-badge">
                                                <i class="bi bi-person-check"></i>
                                                <span>当前用户</span>
                                            </span>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 提升用户为管理员 -->
            <div class="card-section">
                <div class="card-section-header bg-success-custom">
                    <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>提升用户为管理员</h5>
                </div>
                <div class="card-section-body">
                    <form th:action="@{/admin/promote/add}" method="post">
                        <div class="row align-items-end">
                            <div class="col-md-8">
                                <label class="form-label mb-2">
                                    <i class="bi bi-people me-2"></i>选择用户
                                </label>
                                <select name="userId" class="form-select form-select-custom" required>
                                    <option value="">-- 请选择 --</option>
                                    <option th:each="user : ${normalUsers}"
                                            th:value="${user.id}"
                                            th:text="${user.username + ' (' + user.nickname + ')'}">
                                        用户
                                    </option>
                                </select>
                                <div class="form-text mt-2">
                                    <i class="bi bi-info-circle me-1"></i>
                                    普通用户将被提升为管理员，拥有所有管理权限。
                                </div>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-custom btn-custom-success w-100">
                                    <i class="bi bi-person-badge me-2"></i>提升为管理员
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 说明信息 -->
            <div class="alert alert-info-custom">
                <h6 class="fw-bold"><i class="bi bi-info-circle me-2"></i>说明</h6>
                <ul class="mb-0">
                    <li>管理员拥有系统的最高权限，可以管理所有用户和角色。</li>
                    <li>建议仅信任的用户才能设置为管理员。</li>
                    <li>默认管理员账户：<strong>admin / admin123</strong>，请及时修改密码。</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
