<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>管理员设置 - 后台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">🔧 后台管理</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles">📝 博客列表</a>
            <a class="nav-link" href="/logout">🚪 注销</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-3 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-gear me-2"></i>管理菜单
                </div>
                <div class="list-group list-group-flush">
                    <a href="/admin/roles" class="list-group-item list-group-item-action">
                        <i class="bi bi-shield-lock me-2"></i>角色管理
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action">
                        <i class="bi bi-people me-2"></i>用户管理
                    </a>
                    <a href="/admin/promote" class="list-group-item list-group-item-action active">
                        <i class="bi bi-person-badge me-2"></i>管理员设置
                    </a>
                </div>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="col-md-9">
            <!-- 当前管理员列表 -->
            <div class="card mb-4">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>当前管理员列表</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(admins)}" class="text-center text-muted py-4">
                        <i class="bi bi-exclamation-circle me-2"></i>暂无管理员
                    </div>
                    <table th:if="${!#lists.isEmpty(admins)}" class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>昵称</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="admin : ${admins}">
                                <td th:text="${admin.id}">1</td>
                                <td th:text="${admin.username}">admin</td>
                                <td th:text="${admin.nickname}">管理员</td>
                                <td>
                                    <form th:action="@{/admin/promote/remove}" method="post" class="d-inline">
                                        <input type="hidden" name="userId" th:value="${admin.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                th:if="${admin.id != currentUserId}"
                                                onclick="return confirm('确定要移除该用户的管理员身份吗？');">
                                            <i class="bi bi-trash me-1"></i>移除管理员
                                        </button>
                                        <span th:if="${admin.id == currentUserId}" class="text-muted small">
                                            <i class="bi bi-info-circle me-1"></i>当前用户
                                        </span>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 提升用户为管理员 -->
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>提升用户为管理员</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/promote/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label">选择用户</label>
                            <select name="userId" class="form-select" required>
                                <option value="">-- 请选择 --</option>
                                <option th:each="user : ${normalUsers}" 
                                        th:value="${user.id}" 
                                        th:text="${user.username + ' (' + user.nickname + ')'}">
                                    用户
                                </option>
                            </select>
                            <div class="form-text">普通用户将被提升为管理员，拥有所有管理权限。</div>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-person-badge me-1"></i>提升为管理员
                        </button>
                    </form>
                </div>
            </div>

            <!-- 说明信息 -->
            <div class="alert alert-info mt-4">
                <h6><i class="bi bi-info-circle me-2"></i>说明</h6>
                <ul class="mb-0">
                    <li>管理员拥有系统的最高权限，可以管理所有用户和角色。</li>
                    <li>建议仅信任的用户才能设置为管理员。</li>
                    <li>默认管理员账户：<strong>admin / admin123</strong>，请及时修改密码。</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
