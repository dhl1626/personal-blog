<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - 后台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">🔧 后台管理</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles">📝 博客列表</a>
            <a class="nav-link" href="/logout">🚪 注销</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-3 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-gear me-2"></i>管理菜单
                </div>
                <div class="list-group list-group-flush">
                    <a href="/admin/roles" class="list-group-item list-group-item-action">
                        <i class="bi bi-shield-lock me-2"></i>角色管理
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action active">
                        <i class="bi bi-people me-2"></i>用户管理
                    </a>
                    <a href="/admin/promote" class="list-group-item list-group-item-action">
                        <i class="bi bi-person-badge me-2"></i>管理员设置
                    </a>
                </div>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-people me-2"></i>用户列表</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>昵称</th>
                                <th>当前角色</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.username}">username</td>
                                <td th:text="${user.nickname}">nickname</td>
                                <td>
                                    <span th:each="role : ${user.roles}" class="badge bg-primary me-1"
                                          th:text="${role.name}">ROLE</span>
                                    <span th:if="${#lists.isEmpty(user.roles)}" class="text-muted">无角色</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/assign-role}" method="post" class="d-flex">
                                        <input type="hidden" name="userId" th:value="${user.id}">
                                        <select name="roleId" class="form-select form-select-sm me-2" style="width: 150px;">
                                            <option th:each="role : ${roles}" 
                                                    th:value="${role.id}" 
                                                    th:text="${role.name}">ROLE</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-primary">分配角色</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
