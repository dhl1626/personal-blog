<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 后台管理</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%) !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .page-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .page-title {
            color: white;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }
        
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }
        
        .sidebar-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
            height: fit-content;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem;
            color: white;
        }
        
        .sidebar-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .sidebar-menu {
            padding: 1rem 0;
        }
        
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .sidebar-link:hover {
            background: #f8f9fa;
            color: #667eea;
            border-left-color: #667eea;
            padding-left: 1.75rem;
        }
        
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
            border-left-color: #667eea;
        }
        
        .sidebar-link i {
            font-size: 1.2rem;
        }
        
        .content-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
        }
        
        .content-header {
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #e8ecef;
            background: #f8f9fa;
        }
        
        .content-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .content-body {
            padding: 2rem;
        }
        
        .table-custom {
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .table-custom thead th {
            border: none;
            padding: 1rem 1.25rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }
        
        .table-custom tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e8ecef;
        }
        
        .table-custom tbody tr:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            transform: scale(1.005);
        }
        
        .table-custom tbody td {
            padding: 1rem 1.25rem;
            vertical-align: middle;
            color: #2c3e50;
        }
        
        .badge-custom {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        
        .badge-custom.bg-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
        
        .badge-custom.bg-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%) !important;
        }
        
        .form-select-custom {
            border-radius: 12px;
            border: 2px solid #e8ecef;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .form-select-custom:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            outline: none;
        }
        
        .btn-custom {
            padding: 0.6rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }
        
        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .user-name {
            font-weight: 600;
            color: #2c3e50;
        }
        
        @media (max-width: 992px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            
            .sidebar-card {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-gear-fill me-2"></i>后台管理
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles"><i class="bi bi-journal-text me-1"></i>博客列表</a>
            <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>注销</a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="page-title"><i class="bi bi-people me-2"></i>用户管理</h1>
                <p class="page-subtitle mb-0">管理系统用户，分配角色权限</p>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="admin-layout">
        <!-- 左侧菜单 -->
        <div class="sidebar-card">
            <div class="sidebar-header">
                <h5><i class="bi bi-list-ul me-2"></i>管理菜单</h5>
            </div>
            <div class="sidebar-menu">
                <a href="/admin/roles" class="sidebar-link">
                    <i class="bi bi-shield-lock"></i>
                    <span>角色管理</span>
                </a>
                <a href="/admin/users" class="sidebar-link active">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin/promote" class="sidebar-link">
                    <i class="bi bi-person-badge"></i>
                    <span>管理员设置</span>
                </a>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="content-card">
            <div class="content-header">
                <h5><i class="bi bi-people me-2"></i>用户列表</h5>
            </div>
            <div class="content-body">
                <div class="table-responsive">
                    <table class="table table-custom table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户</th>
                                <th>用户名</th>
                                <th>昵称</th>
                                <th>当前角色</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <span class="text-muted" th:text="${user.id}">1</span>
                                </td>
                                <td>
                                    <div class="user-info">
                                        <div class="user-avatar">
                                            <span th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}">U</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="user-name" th:text="${user.username}">username</span>
                                </td>
                                <td>
                                    <span class="text-muted" th:text="${user.nickname}">nickname</span>
                                </td>
                                <td>
                                    <span th:each="role : ${user.roles}" class="badge-custom bg-primary me-1"
                                          th:text="${role.name}">ROLE</span>
                                    <span th:if="${#lists.isEmpty(user.roles)}" class="text-muted">无角色</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/assign-role}" method="post" class="d-flex align-items-center gap-2">
                                        <input type="hidden" name="userId" th:value="${user.id}">
                                        <select name="roleId" class="form-select form-select-custom" style="width: 160px;">
                                            <option th:each="role : ${roles}"
                                                    th:value="${role.id}"
                                                    th:text="${role.name}">ROLE</option>
                                        </select>
                                        <button type="submit" class="btn btn-custom btn-custom-primary">
                                            <i class="bi bi-check me-1"></i>分配
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
