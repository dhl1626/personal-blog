<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 文章管理 - 后台管理系统</title>

    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4e73df;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fc;
            overflow-x: hidden;
        }

        /* ==================== 侧边栏样式 ==================== */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .sidebar-brand-icon {
            font-size: 1.5rem;
            color: white;
            margin-right: 0.75rem;
        }

        .sidebar-brand-text {
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .sidebar-brand-text:hover {
            color: white;
            text-decoration: none;
        }

        .sidebar-heading {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 1.5rem 1rem 0.5rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link i {
            margin-right: 0.75rem;
            font-size: 0.9rem;
        }

        /* ==================== 主内容区域 ==================== */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 0;
            transition: all 0.3s ease;
        }

        .topbar {
            height: 70px;
            background-color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .user-name {
            font-weight: 700;
            color: #5a5c69;
        }

        .page-content {
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #5a5c69;
            margin-bottom: 0;
        }

        .page-subtitle {
            color: #858796;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* 操作栏 */
        .action-bar {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }

        .bulk-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .selected-count {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* 文章列表 */
        .articles-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            overflow: hidden;
        }

        .article-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .article-item {
            display: flex;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e3e6f0;
            transition: all 0.3s ease;
            background: white;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-item:hover {
            background: #f8f9fc;
        }

        .article-item.dragging {
            opacity: 0.5;
            background: #e3e6f0;
        }

        .article-item.drag-over {
            border-top: 2px solid #4e73df;
        }

        .drag-handle {
            cursor: grab;
            color: #858796;
            font-size: 1.25rem;
            margin-right: 1rem;
            padding: 0.25rem;
            transition: color 0.3s ease;
        }

        .drag-handle:hover {
            color: #4e73df;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .article-checkbox {
            margin-right: 1rem;
        }

        .article-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .article-content {
            flex-grow: 1;
            min-width: 0;
        }

        .article-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .article-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .article-title a:hover {
            color: #4e73df;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #858796;
            flex-wrap: wrap;
        }

        .article-meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .article-meta-item i {
            color: #4e73df;
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
            margin-left: 1rem;
        }

        .btn-article-action {
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* 状态标签 */
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.published {
            background-color: #d4edda;
            color: #155724;
        }

        .status-badge.draft {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-badge.archived {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* 分类和标签 */
        .category-badge {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-badge {
            background: #e3e6f0;
            color: #5a5c69;
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #858796;
        }

        .empty-state i {
            font-size: 4rem;
            color: #e3e6f0;
            margin-bottom: 1rem;
        }

        .empty-state h4 {
            color: #5a5c69;
            margin-bottom: 0.5rem;
        }

        /* 筛选器 */
        .filter-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-bar .form-select,
        .filter-bar .form-control {
            border-radius: 10px;
            border: 2px solid #e3e6f0;
            padding: 0.5rem 1rem;
        }

        .filter-bar .form-select:focus,
        .filter-bar .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.15);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                margin-left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                margin-left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .article-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .article-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <a href="/admin/dashboard" class="sidebar-brand-text">
            <span class="sidebar-brand-icon">🎯</span>
            <span>博客管理后台</span>
        </a>
    </div>

    <div class="sidebar-heading">总览</div>
    <a href="/admin/dashboard" class="nav-link">
        <i class="bi bi-speedometer2"></i>
        <span>数据看板</span>
    </a>
    <a href="/admin/articles" class="nav-link active">
        <i class="bi bi-journal-text"></i>
        <span>文章管理</span>
    </a>

    <div class="sidebar-heading">内容</div>
    <a href="/admin/comments" class="nav-link">

    <a href="/admin/categories" class="nav-link">

    <a href="/admin/users" class="nav-link">
        <i class="bi bi-people"></i>

    </a>
    <a href="/admin/roles" class="nav-link">
        <i class="bi bi-shield-lock"></i>

    <a href="/admin/promote" class="nav-link">

    </a>

    <div class="sidebar-heading">返回</div>
    <a href="/articles" class="nav-link">

        <span>博客列表</span>

<!-- 主内容区域 -->
<div class="main-content">
    <!-- 顶部导航栏 -->
    <div class="topbar">
        <button class="btn btn-link d-md-none" id="sidebarToggle">
            <i class="bi bi-list" style="font-size: 1.5rem; color: #5a5c69;"></i>
        </button>

        <div class="user-info">
            <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">U</div>
            <span class="user-name" th:text="${#authentication.name}">Admin</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>退出
            </a>
        </div>
    </div>

    <!-- 页面内容 -->
    <div class="page-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <div>
                <h1 class="page-title">📝 文章管理</h1>
                <p class="page-subtitle">拖拽排序 · 批量操作 · 一键发布/下架</p>
            </div>
            <a href="/article/create" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>写新文章
            </a>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <div class="bulk-actions" id="bulkActions" style="display: none;">
                <span class="selected-count" id="selectedCount">已选择 0 篇</span>
                <button class="btn btn-success btn-sm" onclick="batchPublish()">
                    <i class="bi bi-check-circle me-1"></i>批量发布
                </button>
                <button class="btn btn-warning btn-sm" onclick="batchArchive()">
                    <i class="bi bi-archive me-1"></i>批量下架
                </button>
                <button class="btn btn-danger btn-sm" onclick="batchDelete()">
                    <i class="bi bi-trash me-1"></i>批量删除
                </button>
                <button class="btn btn-secondary btn-sm" onclick="cancelSelection()">
                    <i class="bi bi-x-circle me-1"></i>取消选择
                </button>
            </div>
            <div class="filter-bar" id="filterBar">
                <select class="form-select" id="statusFilter" style="width: auto;" onchange="filterArticles()">
                    <option value="">全部状态</option>
                    <option value="published">已发布</option>
                    <option value="draft">草稿</option>
                    <option value="archived">已归档</option>
                </select>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索文章标题..." 
                       style="width: 250px;" oninput="filterArticles()">
                <select class="form-select" id="categoryFilter" style="width: auto;" onchange="filterArticles()">
                    <option value="">全部分类</option>
                </select>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="articles-card">
            <ul class="article-list" id="articleList">
                <li class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h4>加载中...</h4>
                    <p>正在获取文章列表</p>
                </li>
            </ul>
        </div>
    </div>
</div>

<!-- 引入 SortableJS (拖拽排序库) -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>
// 全局变量
let allArticles = [];
let selectedArticles = new Set();
let sortableInstance = null;

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', function() {
    // 加载文章列表
    loadArticles();

    // 侧边栏切换（移动端）
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('active');
    });
});

/**
 * 加载文章列表
 */
async function loadArticles() {
    try {
        const response = await fetch('/api/admin/articles', {
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
        });
        
        // 检查是否是 HTML 响应（未授权）
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('text/html')) {
            showAuthError();
            return;
        }
        
        if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
                showAuthError();
                return;
            }
            throw new Error('HTTP ' + response.status);
        }
        
        allArticles = await response.json();

        // 加载分类筛选器
        loadCategoryFilter();

        // 渲染列表
        renderArticleList();

        // 初始化拖拽排序
        initSortable();

    } catch (error) {
        console.error('加载文章列表失败:', error);
        showError('加载文章列表失败：' + error.message + '，请刷新页面重试');
    }
}

/**
 * 显示未授权错误提示
 */
function showAuthError() {
    const content = document.querySelector('.page-content');
    if (content) {
        content.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: #e74a3b;"></i>
                <h3 class="mt-4" style="color: #5a5c69;">无权访问</h3>
                <p class="text-muted mt-2">您没有权限访问此页面，请返回文章列表页</p>
                <div class="mt-4">
                    <a href="/articles" class="btn btn-primary me-2">
                        <i class="bi bi-house-door me-1"></i>返回文章列表
                    </a>
                    <a href="/logout" class="btn btn-outline-secondary">
                        <i class="bi bi-box-arrow-right me-1"></i>退出登录
                    </a>
                </div>
            </div>
        `;
    }
}

/**
 * 加载分类筛选器
 */
function loadCategoryFilter() {
    const categoryFilter = document.getElementById('categoryFilter');
    const categories = [...new Set(allArticles.map(a => a.category?.name).filter(Boolean))];
    
    categoryFilter.innerHTML = '<option value="">全部分类</option>' +
        categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
}

/**
 * 渲染文章列表
 */
function renderArticleList() {
    const list = document.getElementById('articleList');
    const statusFilter = document.getElementById('statusFilter').value;
    const searchInput = document.getElementById('searchInput').value.toLowerCase();
    const categoryFilter = document.getElementById('categoryFilter').value;

    // 筛选文章
    let filtered = allArticles.filter(article => {
        if (statusFilter && article.status !== statusFilter) return false;
        if (searchInput && !article.title.toLowerCase().includes(searchInput)) return false;
        if (categoryFilter && article.category?.name !== categoryFilter) return false;
        return true;
    });

    if (filtered.length === 0) {
        list.innerHTML = `
            <li class="empty-state">
                <i class="bi bi-inbox"></i>
                <h4>暂无文章</h4>
                <p>点击"写新文章"开始创作吧</p>
                <a href="/article/create" class="btn btn-primary mt-3">
                    <i class="bi bi-plus-lg me-1"></i>写新文章
                </a>
            </li>
        `;
        return;
    }

    list.innerHTML = filtered.map((article, index) => `
        <li class="article-item" data-id="${article.id}" draggable="true">
            <span class="drag-handle" title="拖拽排序">
                <i class="bi bi-grip-vertical"></i>
            </span>
            <div class="article-checkbox">
                <input type="checkbox" 
                       id="cb-${article.id}" 
                       onchange="toggleSelection(${article.id})"
                       ${selectedArticles.has(article.id) ? 'checked' : ''}>
            </div>
            <div class="article-content">
                <div class="article-title">
                    <a href="/article/${article.id}" title="${escapeHtml(article.title)}">
                        ${escapeHtml(article.title)}
                    </a>
                    <span class="status-badge ${article.status || 'published'}">
                        ${getStatusText(article.status || 'published')}
                    </span>
                    ${article.category ? `<span class="category-badge">${escapeHtml(article.category.name)}</span>` : ''}
                </div>
                <div class="article-meta">
                    <span class="article-meta-item">
                        <i class="bi bi-person"></i>
                        ${escapeHtml(article.author)}
                    </span>
                    <span class="article-meta-item">
                        <i class="bi bi-eye"></i>
                        ${article.views || 0}
                    </span>
                    <span class="article-meta-item">
                        <i class="bi bi-chat"></i>
                        ${(article.comments || []).length}
                    </span>
                    <span class="article-meta-item">
                        <i class="bi bi-calendar"></i>
                        ${formatDate(article.createTime)}
                    </span>
                    ${article.tags && article.tags.length > 0 ? `
                        <span class="article-meta-item">
                            <i class="bi bi-tags"></i>
                            ${article.tags.map(t => `<span class="tag-badge">${escapeHtml(t.name)}</span>`).join('')}
                        </span>
                    ` : ''}
                </div>
            </div>
            <div class="article-actions">
                <a href="/article/${article.id}" class="btn btn-article-action btn-outline-primary" title="查看">
                    <i class="bi bi-eye"></i>
                </a>
                <a href="/article/edit/${article.id}" class="btn btn-article-action btn-outline-warning" title="编辑">
                    <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-article-action btn-outline-success" 
                        onclick="toggleArticleStatus(${article.id})" 
                        title="${article.status === 'published' ? '下架' : '发布'}">
                    <i class="bi bi-${article.status === 'published' ? 'archive' : 'check-circle'}"></i>
                </button>
                <button class="btn btn-article-action btn-outline-danger" 
                        onclick="deleteArticle(${article.id})" 
                        title="删除">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </li>
    `).join('');
}

/**
 * 初始化拖拽排序
 */
function initSortable() {
    const list = document.getElementById('articleList');
    if (sortableInstance) {
        sortableInstance.destroy();
    }

    sortableInstance = new Sortable(list, {
        animation: 150,
        handle: '.drag-handle',
        ghostClass: 'dragging',
        dragClass: 'drag-over',
        onEnd: function(evt) {
            saveSortOrder();
        }
    });
}

/**
 * 保存排序
 */
async function saveSortOrder() {
    const list = document.getElementById('articleList');
    const items = list.querySelectorAll('.article-item');
    const ids = Array.from(items).map(item => parseInt(item.dataset.id));

    try {
        const response = await fetch('/api/admin/articles/update-sort', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        });
        const result = await response.json();

        if (result.success) {
            showSuccess('排序已保存');
            // 重新加载文章列表以更新显示
            loadArticles();
        } else {
            showError(result.message);
        }
    } catch (error) {
        console.error('保存排序失败:', error);
        showError('保存排序失败，请重试');
    }
}

/**
 * 切换选择状态
 */
function toggleSelection(id) {
    if (selectedArticles.has(id)) {
        selectedArticles.delete(id);
    } else {
        selectedArticles.add(id);
    }
    updateBulkActions();
}

/**
 * 更新批量操作栏显示
 */
function updateBulkActions() {
    const bulkActions = document.getElementById('bulkActions');
    const filterBar = document.getElementById('filterBar');
    const selectedCount = document.getElementById('selectedCount');

    if (selectedArticles.size > 0) {
        bulkActions.style.display = 'flex';
        filterBar.style.display = 'none';
        selectedCount.textContent = `已选择 ${selectedArticles.size} 篇`;
    } else {
        bulkActions.style.display = 'none';
        filterBar.style.display = 'flex';
    }
}

/**
 * 取消选择
 */
function cancelSelection() {
    selectedArticles.clear();
    document.querySelectorAll('.article-checkbox input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
    });
    updateBulkActions();
}

/**
 * 批量发布
 */
async function batchPublish() {
    if (selectedArticles.size === 0) {
        showError('请先选择文章');
        return;
    }

    if (!confirm(`确定要发布选中的 ${selectedArticles.size} 篇文章吗？`)) return;

    try {
        const response = await fetch('/api/admin/articles/batch-publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Array.from(selectedArticles))
        });
        const result = await response.json();

        if (result.success) {
            showSuccess(result.message);
            cancelSelection();
            loadArticles();
        } else {
            showError(result.message);
        }
    } catch (error) {
        console.error('批量发布失败:', error);
        showError('操作失败，请重试');
    }
}

/**
 * 切换文章状态
 */
async function toggleArticleStatus(articleId) {
    if (!confirm('确定要切换这篇文章的状态吗？')) return;

    try {
        const response = await fetch(`/api/admin/articles/${articleId}/toggle-status`, {
            method: 'POST'
        });
        const result = await response.json();

        if (result.success) {
            showSuccess(result.message);
            loadArticles();
        } else {
            showError(result.message);
        }
    } catch (error) {
        console.error('切换状态失败:', error);
        showError('操作失败，请重试');
    }
}

/**
 * 删除单篇文章
 */
async function deleteArticle(articleId) {
    if (!confirm('⚠️ 警告：确定要删除这篇文章吗？\n此操作不可恢复！')) return;

    try {
        const response = await fetch('/api/admin/articles/batch-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([articleId])
        });
        const result = await response.json();

        if (result.success) {
            showSuccess(result.message);
            loadArticles();
        } else {
            showError(result.message);
        }
    } catch (error) {
        console.error('删除失败:', error);
        showError('操作失败，请重试');
    }
}

/**
 * 获取状态文本
 */
function getStatusText(status) {
    const statusMap = {
        'published': '已发布',
        'draft': '草稿',
        'archived': '已归档'
    };
    return statusMap[status] || status;
}

/**
 * 格式化日期
 */
function formatDate(dateString) {
    if (!dateString) return '-';
    const date = new Date(dateString);
    return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    });
}

/**
 * HTML 转义
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/**
 * 显示成功提示
 */
function showSuccess(message) {
    alert('✅ ' + message);
}

/**
 * 显示错误提示
 */
function showError(message) {
    alert('❌ ' + message);
}
