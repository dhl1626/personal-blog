<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理 - 后台管理</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%) !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .page-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .page-title {
            color: white;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }
        
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }
        
        .sidebar-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
            height: fit-content;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1.5rem;
            color: white;
        }
        
        .sidebar-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .sidebar-menu {
            padding: 1rem 0;
        }
        
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .sidebar-link:hover {
            background: #f8f9fa;
            color: #667eea;
            border-left-color: #667eea;
            padding-left: 1.75rem;
        }
        
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
            border-left-color: #667eea;
        }
        
        .sidebar-link i {
            font-size: 1.2rem;
        }
        
        .content-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
        }
        
        .card-section {
            margin-bottom: 1.5rem;
        }
        
        .card-section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 2px solid #e8ecef;
            background: #f8f9fa;
        }
        
        .card-section-header h5 {
            margin-bottom: 0;
            font-weight: 700;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card-section-body {
            padding: 1.5rem;
        }
        
        .form-create-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr;
            gap: 1rem;
            align-items: end;
        }
        
        .form-label-custom {
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-control-custom, .form-select-custom {
            border-radius: 12px;
            border: 2px solid #e8ecef;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            outline: none;
        }
        
        .btn-custom {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
            width: 100%;
        }
        
        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .btn-custom-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(17, 153, 142, 0.3);
        }
        
        .btn-custom-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
            color: white;
        }
        
        .btn-custom-danger {
            background: linear-gradient(135deg, #e74a3b 0%, #f5576c 100%);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(231, 74, 59, 0.3);
        }
        
        .btn-custom-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 74, 59, 0.4);
            color: white;
        }
        
        .btn-custom-outline {
            background: white;
            border: 2px solid #e8ecef;
            color: #7f8c8d;
        }
        
        .btn-custom-outline:hover {
            background: #f8f9fa;
            border-color: #bdc3c7;
            color: #2c3e50;
        }
        
        .role-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .role-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }
        
        .role-card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8ecef;
        }
        
        .role-name {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }
        
        .role-description {
            color: #7f8c8d;
            margin-left: 1rem;
            font-size: 0.9rem;
        }
        
        .role-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .role-card-body {
            padding: 1.5rem;
            background: #fafbfc;
        }
        
        .permission-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .permission-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.5rem 0.875rem;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .permission-tag a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        
        .permission-tag a:hover {
            opacity: 1;
        }
        
        .assign-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.75rem;
            align-items: center;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #bdc3c7;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }
        
        @media (max-width: 992px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            
            .form-create-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-gear-fill me-2"></i>后台管理
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles"><i class="bi bi-journal-text me-1"></i>博客列表</a>
            <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>注销</a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="page-title"><i class="bi bi-shield-lock me-2"></i>角色管理</h1>
                <p class="page-subtitle mb-0">创建和管理系统角色，分配权限</p>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="admin-layout">
        <!-- 左侧菜单 -->
        <div class="sidebar-card">
            <div class="sidebar-header">
                <h5><i class="bi bi-list-ul me-2"></i>管理菜单</h5>
            </div>
            <div class="sidebar-menu">
                <a href="/admin/roles" class="sidebar-link active">
                    <i class="bi bi-shield-lock"></i>
                    <span>角色管理</span>
                </a>
                <a href="/admin/users" class="sidebar-link">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
                <a href="/admin/promote" class="sidebar-link">
                    <i class="bi bi-person-badge"></i>
                    <span>管理员设置</span>
                </a>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="content-card">
            <!-- 创建角色 -->
            <div class="card-section">
                <div class="card-section-header">
                    <h5><i class="bi bi-plus-circle me-2"></i>创建新角色</h5>
                </div>
                <div class="card-section-body">
                    <form th:action="@{/admin/roles/create}" method="post" class="form-create-row">
                        <div>
                            <label class="form-label-custom">角色名</label>
                            <input type="text" class="form-control-custom" name="name" placeholder="如：ROLE_ADMIN" required>
                        </div>
                        <div>
                            <label class="form-label-custom">角色描述</label>
                            <input type="text" class="form-control-custom" name="description" placeholder="角色描述">
                        </div>
                        <div>
                            <button type="submit" class="btn btn-custom btn-custom-primary">
                                <i class="bi bi-plus-circle me-1"></i>创建
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 角色列表 -->
            <div class="card-section">
                <div class="card-section-header">
                    <h5><i class="bi bi-list-ul me-2"></i>角色列表</h5>
                </div>
                <div class="card-section-body">
                    <div th:if="${#lists.isEmpty(roles)}" class="empty-state">
                        <i class="bi bi-shield-exclamation"></i>
                        <p class="mb-0">暂无角色</p>
                    </div>
                    
                    <div th:each="role : ${roles}" class="role-card">
                        <div class="role-card-header">
                            <div class="d-flex align-items-center">
                                <span class="role-name" th:text="${role.name}">ROLE_NAME</span>
                                <span class="role-description text-muted" th:text="${role.description}">描述</span>
                            </div>
                            <div class="role-actions">
                                <button class="btn btn-custom btn-custom-outline btn-sm" type="button" data-bs-toggle="collapse"
                                        th:data-bs-target="'#permCollapse' + ${role.id}">
                                    <i class="bi bi-shield-check me-1"></i>管理权限
                                </button>
                                <a th:href="@{/admin/roles/delete/{id}(id=${role.id})}"
                                   class="btn btn-custom btn-custom-danger btn-sm"
                                   onclick="return confirm('确定要删除此角色吗？');">
                                    <i class="bi bi-trash me-1"></i>删除
                                </a>
                            </div>
                        </div>
                        <div class="collapse" th:id="'permCollapse' + ${role.id}">
                            <div class="role-card-body">
                                <h6 class="mb-3 fw-bold text-muted">当前权限</h6>
                                <div class="permission-tags mb-4">
                                    <span th:each="perm : ${role.permissions}" class="permission-tag">
                                        <i class="bi bi-check-circle"></i>
                                        <span th:text="${perm.name}">permission</span>
                                        <a th:href="@{/admin/roles/remove-permission(roleId=${role.id}, permissionId=${perm.id})}"
                                           class="ms-1">×</a>
                                    </span>
                                    <span th:if="${#lists.isEmpty(role.permissions)}" class="text-muted">暂无权限</span>
                                </div>
                                
                                <h6 class="mb-3 fw-bold text-muted">分配权限</h6>
                                <form th:action="@{/admin/roles/assign-permission}" method="post" class="assign-form">
                                    <input type="hidden" name="roleId" th:value="${role.id}">
                                    <select name="permissionId" class="form-select-custom">
                                        <option th:each="perm : ${permissions}"
                                                th:value="${perm.id}"
                                                th:text="${perm.name + ' - ' + perm.description}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-custom btn-custom-success">
                                        <i class="bi bi-check-circle me-1"></i>分配
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
