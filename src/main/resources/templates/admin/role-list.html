<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>角色管理 - 后台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">🔧 后台管理</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles">📝 博客列表</a>
            <a class="nav-link" href="/logout">🚪 注销</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 操作提示 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}">成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMsg}">错误</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-3 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-gear me-2"></i>管理菜单
                </div>
                <div class="list-group list-group-flush">
                    <a href="/admin/roles" class="list-group-item list-group-item-action active">
                        <i class="bi bi-shield-lock me-2"></i>角色管理
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action">
                        <i class="bi bi-people me-2"></i>用户管理
                    </a>
                    <a href="/admin/promote" class="list-group-item list-group-item-action">
                        <i class="bi bi-person-badge me-2"></i>管理员设置
                    </a>
                </div>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="col-md-9">
            <!-- 创建角色 -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>创建角色</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/roles/create}" method="post" class="row g-3">
                        <div class="col-md-5">
                            <input type="text" class="form-control" name="name" placeholder="角色名（如：ROLE_ADMIN）" required>
                        </div>
                        <div class="col-md-5">
                            <input type="text" class="form-control" name="description" placeholder="角色描述">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">创建</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 角色列表 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>角色列表</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(roles)}" class="text-center text-muted py-4">
                        暂无角色
                    </div>
                    <div th:each="role : ${roles}" class="card mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div>
                                <strong class="text-primary" th:text="${role.name}">ROLE_NAME</strong>
                                <span class="text-muted ms-2" th:text="${role.description}">描述</span>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="collapse"
                                        th:data-bs-target="'#permCollapse' + ${role.id}">
                                    <i class="bi bi-shield-check me-1"></i>管理权限
                                </button>
                                <a th:href="@{/admin/roles/delete/{id}(id=${role.id})}" 
                                   class="btn btn-sm btn-outline-danger ms-1"
                                   onclick="return confirm('确定要删除此角色吗？');">
                                    <i class="bi bi-trash me-1"></i>删除
                                </a>
                            </div>
                        </div>
                        <div class="collapse" th:id="'permCollapse' + ${role.id}">
                            <div class="card-body bg-light">
                                <h6>当前权限：</h6>
                                <div class="mb-3">
                                    <span th:each="perm : ${role.permissions}" class="badge bg-success me-2 mb-1">
                                        <i class="bi bi-check-circle me-1"></i>
                                        <span th:text="${perm.name}">permission</span>
                                        <a th:href="@{/admin/roles/remove-permission(roleId=${role.id}, permissionId=${perm.id})}"
                                           class="text-white ms-1 text-decoration-none">×</a>
                                    </span>
                                    <span th:if="${#lists.isEmpty(role.permissions)}" class="text-muted">暂无权限</span>
                                </div>
                                <h6>分配权限：</h6>
                                <form th:action="@{/admin/roles/assign-permission}" method="post" class="row g-2">
                                    <input type="hidden" name="roleId" th:value="${role.id}">
                                    <div class="col-auto">
                                        <select name="permissionId" class="form-select">
                                            <option th:each="perm : ${permissions}" 
                                                    th:value="${perm.id}" 
                                                    th:text="${perm.name + ' - ' + perm.description}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-auto">
                                        <button type="submit" class="btn btn-sm btn-success">分配</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
