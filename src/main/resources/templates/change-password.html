<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        .strength-weak { background-color: #dc3545; width: 33%; }
        .strength-medium { background-color: #ffc107; width: 66%; }
        .strength-strong { background-color: #198754; width: 100%; }
    </style>
</head>
<body class="bg-light">

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/articles">📝 博客系统</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/articles">📝 博客列表</a>
            <a class="nav-link" href="/article/my-blogs">📖 我的博客</a>
            <a class="nav-link" href="/logout">🚪 注销</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- 成功提示 -->
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                密码修改成功！请牢记新密码。
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 错误提示 -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">错误信息</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-key me-2"></i>修改密码</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/profile/change-password}" method="post">
                        <!-- 原密码 -->
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">
                                <i class="bi bi-lock me-1"></i>原密码
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="oldPassword" name="oldPassword" 
                                       placeholder="请输入原密码" required>
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('oldPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 新密码 -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">
                                <i class="bi bi-lock-fill me-1"></i>新密码
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="newPassword" name="newPassword" 
                                       placeholder="请输入新密码（至少 6 位）" required
                                       minlength="6" oninput="checkPasswordStrength(this.value)">
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('newPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <!-- 密码强度指示器 -->
                            <div class="password-strength" id="passwordStrength"></div>
                            <small class="text-muted" id="strengthText"></small>
                        </div>

                        <!-- 确认新密码 -->
                        <div class="mb-3">
                            <label for="confirmNewPassword" class="form-label">
                                <i class="bi bi-lock-fill me-1"></i>确认新密码
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmNewPassword" 
                                       name="confirmNewPassword" placeholder="请再次输入新密码" required
                                       oninput="checkPasswordMatch(this.value)">
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('confirmNewPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-danger" id="passwordMatchText"></small>
                        </div>

                        <!-- 密码要求提示 -->
                        <div class="alert alert-info">
                            <h6 class="mb-2"><i class="bi bi-info-circle me-1"></i>密码要求：</h6>
                            <ul class="mb-0 small">
                                <li>至少 6 个字符</li>
                                <li>建议包含大小写字母、数字和特殊字符</li>
                                <li>不要使用过于简单的密码（如 123456）</li>
                            </ul>
                        </div>

                        <!-- 提交按钮 -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i>确认修改
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 返回链接 -->
            <div class="text-center mt-4">
                <a href="/articles" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回首页
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 切换密码显示/隐藏
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }

    // 检查密码强度
    function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('passwordStrength');
        const strengthText = document.getElementById('strengthText');
        
        let strength = 0;
        
        // 长度检查
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        
        // 字符类型检查
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^a-zA-Z0-9]/.test(password)) strength++;
        
        // 更新显示
        strengthBar.className = 'password-strength';
        if (strength <= 2) {
            strengthBar.classList.add('strength-weak');
            strengthText.textContent = '密码强度：弱';
            strengthText.className = 'text-danger';
        } else if (strength <= 4) {
            strengthBar.classList.add('strength-medium');
            strengthText.textContent = '密码强度：中';
            strengthText.className = 'text-warning';
        } else {
            strengthBar.classList.add('strength-strong');
            strengthText.textContent = '密码强度：强';
            strengthText.className = 'text-success';
        }
    }

    // 检查密码匹配
    function checkPasswordMatch(confirmPassword) {
        const newPassword = document.getElementById('newPassword').value;
        const matchText = document.getElementById('passwordMatchText');
        
        if (confirmPassword && newPassword !== confirmPassword) {
            matchText.textContent = '⚠️ 两次输入的密码不一致';
        } else {
            matchText.textContent = '';
        }
    }
</script>
</body>
</html>
