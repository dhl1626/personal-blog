<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title} + ' - 博客详情'">文章详情</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 👇 新增：GitHub Markdown 样式库 (让渲染出的 HTML 好看) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">

    <style>
        /* 自定义一些细节样式 */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: #fff; /* 确保背景是白色，防止透明导致阅读困难 */
            border: 1px solid #dee2e6; /* 加一个淡淡的边框 */
            border-radius: 6px;
        }

        /* 响应式调整：手机上减少内边距 */
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }

        /* 代码块横向滚动 */
        .markdown-body pre {
            background-color: #f6f8fa;
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
        }

        /* 评论区域样式 */
        .comment-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        .comment-meta {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <!-- 返回按钮 -->
    <div class="mb-3">
        <a href="/articles" class="btn btn-outline-secondary btn-sm">⬅ 返回列表</a>
        <!-- 可选：如果是作者本人，可以显示编辑按钮 (需要后端传递 isAuthor 变量) -->
        <!-- <a th:if="${isAuthor}" th:href="@{/article/edit/{id}(id=${article.id})}" class="btn btn-warning btn-sm float-end">✏️ 编辑</a> -->
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="mb-0 fw-bold" th:text="${article.title}">文章标题</h2>
        </div>
        
        <div class="mb-3">
            <!-- 分类 -->
            <span class="badge bg-primary me-2">
                📂 <span th:text="${article.category?.name ?: '未分类'}">分类</span>
            </span>
            
            <!-- 标签列表 -->
            <span th:if="${article.tags != null and !article.tags.isEmpty()}">
                <span th:each="tag : ${article.tags}" class="me-1">
                    <a th:href="@{/articles?tag={name}(name=${tag.name})}" 
                    class="badge bg-secondary text-decoration-none hover-badge"
                    th:text="'#' + ${tag.name}">
                    #标签
                    </a>
                </span>
            </span>
        </div>

        <div class="card-body p-0"> <!-- p-0 移除默认 padding，让 markdown-body 自己控制 -->
            
            <!-- 文章元信息 -->
            <div class="p-3 border-bottom bg-light">
                <small class="text-muted">
                    <span class="me-3">👤 作者：<strong th:text="${article.author}">作者</strong></span>
                    <span class="me-3">📅 时间：<span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd HH:mm')}">时间</span></span>
                    <span>🔖 ID: <span th:text="${article.id}">ID</span></span>
                </small>
            </div>

            <!-- 👇 核心修改区域 -->
            <!-- 1. 添加 class="markdown-body" 以应用 GitHub 风格样式 -->
            <!-- 2. 使用 th:utext 渲染 HTML，而不是 th:text -->
            <!-- 3. 数据源改为 article.htmlContent (后端转好后的 HTML) -->
            <div class="markdown-body" th:utext="${article.htmlContent}">
                <!-- 如果 htmlContent 为空，这里会显示空白，确保后端已生成 HTML -->
            </div>
            <!-- 👆 核心修改区域结束 -->

        </div>
    </div>

    <!-- 评论区域 -->
    <div class="card shadow-sm mt-4">
        <div class="card-header bg-light py-3">
            <h5 class="mb-0">💬 评论 (<span th:text="${#lists.size(comments)}">0</span>)</h5>
        </div>
        <div class="card-body">
            <!-- 评论成功提示 -->
            <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:if="${param.msg[0] == 'comment_success'}">评论发表成功！</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 评论失败提示 -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:if="${param.error[0] == 'empty_comment'}">评论内容不能为空！</span>
                <span th:if="${param.error[0] == 'comment_failed'}">评论失败，请重试。</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 评论列表 -->
            <div th:if="${#lists.isEmpty(comments)}" class="text-center text-muted py-4">
                <i class="bi bi-chat-square-text me-2"></i>暂无评论，快来抢沙发吧！
            </div>

            <div th:each="comment : ${comments}" class="comment-item">
                <div class="d-flex">
                    <!-- 头像 -->
                    <div class="comment-avatar me-3 flex-shrink-0">
                        <span th:text="${#strings.toUpperCase(#strings.substring(comment.user.nickname, 0, 1))}">U</span>
                    </div>
                    <!-- 评论内容 -->
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong class="text-primary" th:text="${comment.user.nickname}">用户名</strong>
                            <small class="comment-meta">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#dates.format(comment.createTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                            </small>
                        </div>
                        <p class="mt-2 mb-0" th:text="${comment.content}">评论内容</p>
                    </div>
                </div>
            </div>

            <!-- 发表评论表单（仅登录用户可见） -->
            <div sec:authorize="isAuthenticated()" class="mt-4 pt-4 border-top">
                <h6 class="mb-3">📝 发表评论</h6>
                <form th:action="@{/article/{id}/comment/save(id=${article.id})}" method="post">
                    <div class="mb-3">
                        <textarea class="form-control" name="content" rows="3" 
                                  placeholder="写下你的评论..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-send me-1"></i>发表评论
                    </button>
                </form>
            </div>

            <!-- 未登录提示 -->
            <div sec:authorize="!isAuthenticated()" class="mt-4 pt-4 border-top text-center">
                <p class="text-muted mb-2">💡 登录后即可发表评论</p>
                <a href="/login" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i>去登录
                </a>
            </div>
        </div>
    </div>

    <!-- 底部操作区 -->
    <div class="mt-4 text-center">
        <a href="/articles" class="btn btn-primary px-4">⬅ 返回列表</a>
    </div>
</div>

<!-- Bootstrap JS (可选，如果需要下拉菜单等交互) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
