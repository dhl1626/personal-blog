<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">文章详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0" th:text="${article.title}">标题</h2>
        </div>
        <div class="card-body">
            <div class="mb-3 p-3 bg-light rounded">
                <p class="mb-1" th:text="${article.content}">内容</p>
            </div>
            <small class="text-muted d-block mt-2">
                👤 作者：<span th:text="${article.author}">作者</span> | 
                🔖 ID：<span th:text="${article.id}">ID</span>
            </small>
        </div>
    </div>
    <a href="/articles" class="btn btn-primary mt-3">⬅ 返回列表</a>
</body>
</html>
