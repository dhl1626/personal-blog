<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>✍️ 写新文章</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Vditor 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/vditor/dist/index.css" />
    <!-- 引入 Vditor 脚本 -->
    <script src="https://unpkg.com/vditor/dist/index.min.js"></script>
    <style>
        /* 调整编辑器高度，使其更舒适 */
        #vditor-editor {
            min-height: 400px; 
        }
        /* 修复可能的样式冲突 */
        .vditor-reset {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">✍️ <span th:text="${article != null and article.id != null} ? '编辑文章' : '写新文章'">写新文章</span></h3>
        </div>
        <div class="card-body">
            <!-- 表单提交到 /article/save -->
            <form th:action="@{/article/save}" method="post">
                
                <!-- 如果是编辑模式，需要传入 ID -->
                <input type="hidden" th:if="${article != null and article.id != null}" th:name="id" th:value="${article.id}">

                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">标题</label>
                    <input type="text" 
                           class="form-control" 
                           id="title" 
                           name="title" 
                           required 
                           placeholder="输入文章标题"
                           th:value="${article != null} ? ${article.title} : ''">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">内容 (Markdown)</label>
                    
                    <!-- 1. 原始的 textarea 隐藏起来，用于表单提交 -->
                    <!-- 注意：name="content" 必须保留，否则后端收不到数据 -->
                    <textarea id="content" name="content" style="display:none;"></textarea>
                    
                    <!-- 2. Vditor 的渲染容器 -->
                    <div id="vditor-editor"></div>
                    
                    <div class="form-text text-muted">支持 Markdown 语法，支持代码高亮、表格、流程图。</div>
                </div>

                <div class="mb-3 alert alert-info d-flex align-items-center">
                    <span class="me-2">👤 作者：</span>
                    <strong th:text="${#authentication.name}">当前用户</strong>
                    <span class="ms-2 text-muted small">(自动关联，不可修改)</span>
                    <!-- 如果需要后端自动绑定作者，这里不需要 input 字段，Controller 里从 SecurityContext 获取即可 -->
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">💾 保存发布</button>
                    <a href="/articles" class="btn btn-outline-secondary">❌ 取消</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 初始化 Vditor 脚本 -->
    <script>
        // 获取初始内容 (如果是编辑模式，Thymeleaf 会渲染出文章内容；如果是新建，则为空字符串)
        // 注意：如果内容中包含单引号，可能需要转义，但 Thymeleaf 的 [[...]] 语法通常处理得较好
        var initialContent = "[[${article != null and article.content != null} ? ${article.content} : '']]";
        
        // 如果初始内容是字面量的 'null' 或空，修正为空字符串
        if (initialContent === 'null' || initialContent === '') {
            initialContent = '';
        }

        var vditor = new Vditor('vditor-editor', {
            height: 500,
            mode: 'sv', // 'sv'(分屏预览), 'wysiwyg'(所见即所得), 'ir'(即时渲染)。推荐技术博客用 'sv' 或 'ir'
            placeholder: '请输入 Markdown 内容...',
            value: initialContent,
            
            // 缓存配置 (开发时可开启，生产环境建议关闭或谨慎使用)
            cache: {
                enable: false, 
            },

            // 预览配置
            preview: {
                theme: {
                    current: 'light',
                },
                hljs: {
                    enable: true,
                    style: 'github', // 代码高亮风格
                },
                markdown: {
                    setExt: true, // 允许自定义扩展
                }
            },

            // 工具栏配置 (可按需精简)
            toolbar: [
                'emoji', 'headings', 'bold', 'italic', 'strike', 'link', '|',
                'list', 'ordered-list', 'check', 'outdent', 'indent', '|',
                'quote', 'line', 'code', 'inline-code', 'insert-before', 'insert-after', '|',
                'table', 'upload', '|',
                'undo', 'redo', '|',
                'edit-mode', 'content-theme', 'code-theme', 'fullscreen', 'preview', 'both', '|',
                'help'
            ],

            // 【关键】当内容变化时，同步到隐藏的 textarea
            input: function (value) {
                document.getElementById('content').value = value;
            },

            // 初始化完成后也同步一次
            after: function () {
                document.getElementById('content').value = vditor.getValue();
            },

            // 图片上传配置 (可选，如果还没做后端上传接口，可以先注释掉或留空，此时只能粘贴网络图片链接)
            /*
            upload: {
                url: '/api/upload/image', 
                max: 5 * 1024 * 1024,
                filename: function (name) {
                    return name.replace(/[^(a-zA-Z0-9\u4e00-\u9fa5\.)]/g, '').replace(/[\?\\/:|<>\*\[\]\(\)\$%\{\}@~]/g, '').replace(/\s/g, '');
                },
                success: function (editor, msg) {
                    // 根据后端返回格式处理
                },
                error: function () {
                    alert('图片上传失败');
                }
            }
            */
        });
    </script>
</body>
</html>
