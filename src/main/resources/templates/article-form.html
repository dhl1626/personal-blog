<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>✍️ 写新文章</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">✍️ 写新文章</h3>
        </div>
        <div class="card-body">
            <!-- 表单提交到 /article/save -->
            <form th:action="@{/article/save}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">标题</label>
                    <input type="text" class="form-control" id="title" name="title" required placeholder="输入文章标题">
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label fw-bold">内容</label>
                    <textarea class="form-control" id="content" name="content" rows="6" required placeholder="写下你的想法..."></textarea>
                </div>
                <div class="mb-3 alert alert-info">
                    👤 作者：<span th:text="${#authentication.name}">当前用户</span>（自动关联，不可修改）
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">💾 保存发布</button>
                    <a href="/articles" class="btn btn-outline-secondary">❌ 取消</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
