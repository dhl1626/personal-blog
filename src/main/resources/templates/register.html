<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>會員註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h3>會員註冊</h3>
                </div>
                <div class="card-body">
                    <!-- 错误/成功提示 -->
                    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
                    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
                    
                    <form th:action="@{/auth/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名（登录用）</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">昵称（显示用）</label>
                            <input type="text" name="nickname" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100">✅ 立即注册</button>
                    </form>
                    <div class="text-center mt-3">
                        已有账号？<a href="/login">去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
