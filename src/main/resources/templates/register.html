<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员注册</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* 背景装饰圆圈 */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }
        
        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }
        
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            animation-delay: -3s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .register-container {
            position: relative;
            z-index: 1;
        }
        
        .register-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .register-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
        }
        
        .register-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .register-header h3 {
            color: white;
            font-weight: 800;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        
        .register-header .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }
        
        .register-body {
            padding: 2.5rem 2rem;
            background: white;
        }
        
        .form-floating {
            margin-bottom: 1.25rem;
        }
        
        .form-floating input {
            border-radius: 12px;
            border: 2px solid #e8ecef;
            padding-left: 3rem;
            transition: all 0.3s ease;
        }
        
        .form-floating input:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 0.2rem rgba(17, 153, 142, 0.15);
        }
        
        .form-floating label {
            padding-left: 3rem;
            color: #7f8c8d;
        }
        
        .input-icon {
            position: absolute;
            top: 50%;
            left: 1.2rem;
            transform: translateY(-50%);
            color: #bdc3c7;
            font-size: 1.2rem;
            transition: color 0.3s ease;
            z-index: 5;
        }
        
        .form-floating input:focus + .input-icon,
        .form-floating input:not(:placeholder-shown) + .input-icon {
            color: #11998e;
        }
        
        .btn-register {
            width: 100%;
            padding: 0.875rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.5);
        }
        
        .btn-register:active {
            transform: translateY(0);
        }
        
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e8ecef;
        }
        
        .divider span {
            position: relative;
            background: white;
            padding: 0 1rem;
            color: #7f8c8d;
            font-size: 0.875rem;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #7f8c8d;
        }
        
        .login-link a {
            color: #11998e;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .login-link a:hover {
            color: #38ef7d;
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .back-home:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }
        
        .back-home i {
            margin-right: 0.5rem;
        }
        
        .password-requirements {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        .password-requirements ul {
            margin-bottom: 0;
            padding-left: 1.25rem;
            color: #7f8c8d;
        }
        
        .password-requirements li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- 返回首页链接 -->
    <a href="/" class="back-home">
        <i class="bi bi-arrow-left"></i>返回首页
    </a>
    
    <div class="register-container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card register-card">
                    <div class="register-header">
                        <h3><i class="bi bi-person-plus me-2"></i>会员注册</h3>
                        <p class="subtitle mb-0">创建账户，开启博客之旅</p>
                    </div>
                    <div class="register-body">
                        <!-- 错误/成功提示 -->
                        <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center">
                            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                            <span th:text="${errorMsg}">错误信息</span>
                        </div>
                        <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <span th:text="${successMsg}">成功信息</span>
                        </div>

                        <form th:action="@{/auth/register}" method="post">
                            <div class="form-floating position-relative">
                                <input type="text" name="username" class="form-control" id="username" 
                                       placeholder="请输入用户名" required>
                                <label for="username">用户名（登录用）</label>
                                <i class="bi bi-person input-icon"></i>
                            </div>
                            
                            <div class="form-floating position-relative">
                                <input type="password" name="password" class="form-control" id="password" 
                                       placeholder="请输入密码" required>
                                <label for="password">密码</label>
                                <i class="bi bi-lock input-icon"></i>
                            </div>
                            
                            <div class="form-floating position-relative">
                                <input type="text" name="nickname" class="form-control" id="nickname" 
                                       placeholder="请输入昵称" required>
                                <label for="nickname">昵称（显示用）</label>
                                <i class="bi bi-heart input-icon"></i>
                            </div>
                            
                            <div class="password-requirements">
                                <strong><i class="bi bi-info-circle me-1"></i>密码要求：</strong>
                                <ul class="mt-2">
                                    <li>至少 6 个字符</li>
                                    <li>建议包含大小写字母、数字和特殊字符</li>
                                </ul>
                            </div>
                            
                            <button type="submit" class="btn btn-register mt-4">
                                <i class="bi bi-check-circle me-2"></i>立即注册
                            </button>
                        </form>
                        
                        <div class="divider">
                            <span>已有账号？</span>
                        </div>
                        
                        <div class="login-link">
                            <a href="/login">
                                <i class="bi bi-box-arrow-in-right me-1"></i>去登录
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
