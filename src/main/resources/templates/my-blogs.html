<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="/articles">📝 博客系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">🔑 登录</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/auth/register">会员注册</a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            👤 个人中心
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/article/my-blogs">📖 我的博客</a></li>
                            <li><a class="dropdown-item" href="/profile/change-password">🔑 修改密码</a></li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" href="/admin">🔧 后台管理</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">🚪 注销</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="btn btn-success btn-sm ms-2" href="/article/form">✍️ 写文章</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 操作结果提示 -->
    <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:if="${param.msg[0] == 'saved'}">文章已成功保存！</span>
        <span th:if="${param.msg[0] == 'deleted'}">文章已成功删除！</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:if="${param.error[0] == 'forbidden'}">操作失败：您没有权限执行此操作。</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 页面标题和操作区 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary"><i class="bi bi-person-circle me-2"></i>我的博客</h1>
        <a href="/article/form" class="btn btn-success btn-lg">
            <i class="bi bi-pencil-square me-1"></i>写文章
        </a>
    </div>

    <!-- 统计信息 -->
    <div class="alert alert-info mb-4">
        <i class="bi bi-info-circle me-2"></i>
        你共发布了 <strong th:text="${#lists.size(articleList)}">0</strong> 篇博客
    </div>

    <!-- 文章列表 -->
    <div th:if="${#lists.isEmpty(articleList)}" class="alert alert-info text-center">
        <i class="bi bi-inbox me-2"></i>暂无文章，快去写一篇吧！
    </div>

    <div th:each="article : ${articleList}" class="card mb-3 shadow-sm border-0">
        <div class="card-body">
            <h5 class="card-title">
                <a th:href="@{/article/{id}(id=${article.id})}"
                   class="text-decoration-none text-dark fw-bold fs-5"
                   th:text="${article.title}">
                    标题
                </a>
            </h5>
            <p class="card-text text-muted mt-2">
                <span th:text="${#strings.abbreviate(article.content, 150)}">内容预览...</span>
            </p>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <small class="text-muted">
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${article.createTime != null ? #dates.format(article.createTime, 'yyyy-MM-dd HH:mm') : '暂无时间'}">时间</span>
                </small>

                <div class="btn-group">
                    <a th:href="@{/article/edit/{id}(id=${article.id})}"
                       class="btn btn-sm btn-outline-primary">
                       <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a th:href="@{/article/delete/{id}(id=${article.id})}"
                        class="btn btn-sm btn-outline-danger ms-1"
                        onclick="return confirm('⚠️ 确定要删除这篇文章吗？\n\n此操作不可恢复！');">
                        <i class="bi bi-trash"></i> 删除
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 text-center">
        <a href="/article/list" class="btn btn-outline-secondary me-2">
            <i class="bi bi-journal-text me-1"></i> 全部博客
        </a>
        <a href="/" class="btn btn-secondary">
            <i class="bi bi-house me-1"></i> 返回首页
        </a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
