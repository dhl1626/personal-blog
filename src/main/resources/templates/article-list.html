<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客列表</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-bottom: 2rem;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .hero-title {
            color: white;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .article-card {
            transition: all 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: visible;
            position: relative;
            z-index: 1;
        }

        .article-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            z-index: 2;
        }

        .article-card .card-body {
            background: white;
            z-index: 3;
            position: relative;
        }
        
        .article-title-link {
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.25rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .article-title-link:hover {
            color: #667eea;
            text-decoration: none;
        }
        
        .article-meta {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .action-buttons .btn {
            position: relative;
            z-index: 10;
            white-space: nowrap;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .empty-state i {
            font-size: 5rem;
            color: #bdc3c7;
            margin-bottom: 1rem;
            display: block;
        }
        
        .write-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            border: none;
        }
        
        .write-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            color: white;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .btn-outline-primary:hover,
        .btn-outline-danger:hover {
            transform: translateY(-2px);
        }
        
        .card-text {
            color: #6c757d;
            line-height: 1.7;
        }
        
        /* 搜索框样式 */
        .search-form .input-group-text {
            background-color: white;
            border-color: #e8ecef;
            border-radius: 12px 0 0 12px;
        }
        
        .search-form .form-control {
            border-color: #e8ecef;
            border-radius: 0 12px 12px 0;
            padding: 0.6rem 1rem;
        }
        
        .search-form .form-control:focus {
            border-color: #667eea;
            box-shadow: none;
        }
        
        .search-form .form-select {
            border-radius: 12px;
            border-color: #e8ecef;
            padding: 0.6rem 1rem;
        }
        
        .search-form .form-select:focus {
            border-color: #667eea;
            box-shadow: none;
        }
        
        .search-form .btn-primary {
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
        }
        
        .search-form .btn-outline-secondary {
            border-radius: 12px;
        }
        
        .search-form .card {
            border-radius: 15px;
        }
        
        @media (max-width: 768px) {
            .hero-title {
                font-size: 1.5rem;
            }
            
            .article-card .row > div:first-child {
                margin-bottom: 1rem;
            }
            
            .action-buttons {
                justify-content: flex-start;
            }
            
            .search-form .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/articles">
                <i class="bi bi-journal-bookmark-fill me-2"></i>博客系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right me-1"></i>登录</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/auth/register"><i class="bi bi-person-plus me-1"></i>注册</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="nav-link">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="principal.username"></span>
                        </span>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-gear me-1"></i>个人中心
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/article/my-blogs"><i class="bi bi-file-text me-2"></i>我的博客</a></li>
                            <li><a class="dropdown-item" href="/profile/change-password"><i class="bi bi-key me-2"></i>修改密码</a></li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" href="/admin"><i class="bi bi-shield-lock me-2"></i>后台管理</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>注销</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="btn btn-light btn-sm ms-2 px-4" href="/article/form">
                            <i class="bi bi-pencil-square me-1"></i>写文章
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero 区域 -->
    <div class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 col-md-8">
                    <h1 class="hero-title">
                        <i class="bi bi-journal-text me-2"></i>
                        <span th:text="${searchTitle != null} ? ${searchTitle} : '博客列表'">博客列表</span>
                    </h1>
                    <p class="text-white-50 mb-0">
                        <span th:if="${searchResultCount != null}">
                            找到 <strong th:text="${searchResultCount}">0</strong> 篇相关文章
                        </span>
                        <span th:unless="${searchResultCount != null}">
                            探索精彩文章，分享知识与见解
                        </span>
                    </p>
                </div>
                <div class="col-lg-6 col-md-4 mt-3 mt-md-0">
                    <div class="d-flex justify-content-md-end gap-2">
                        <a href="/article/form" class="btn btn-light btn-lg px-4" sec:authorize="isAuthenticated()">
                            <i class="bi bi-pencil-square me-2"></i>写文章
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- 搜索框区域 -->
            <div class="row mt-4">
                <div class="col-12">
                    <form th:action="@{/article/search}" method="get" class="search-form">
                        <div class="card border-0 shadow-lg">
                            <div class="card-body p-3">
                                <div class="row g-2 align-items-center">
                                    <div class="col-lg-4 col-md-6">
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0">
                                                <i class="bi bi-search text-muted"></i>
                                            </span>
                                            <input type="text" 
                                                   name="keyword" 
                                                   class="form-control border-start-0 ps-0" 
                                                   placeholder="搜索标题、作者、内容..."
                                                   th:value="${searchKeyword}">
                                        </div>
                                    </div>
                                    <div class="col-lg-3 col-md-6">
                                        <select name="categoryId" class="form-select">
                                            <option value="">全部分类</option>
                                            <option th:each="cat : ${categories}"
                                                    th:value="${cat.id}"
                                                    th:text="${cat.name}"
                                                    th:selected="${activeCategory != null and activeCategory == cat.id}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-lg-3 col-md-6">
                                        <select name="tag" class="form-select">
                                            <option value="">全部标签</option>
                                            <option th:if="${hotTags != null}" th:each="tag : ${hotTags}"
                                                    th:value="${tag.name}"
                                                    th:text="${tag.name}"
                                                    th:selected="${activeTag != null and activeTag == tag.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-lg-2 col-md-6">
                                        <div class="d-grid gap-2 d-md-flex">
                                            <button type="submit" class="btn btn-primary flex-fill">
                                                <i class="bi bi-search me-1"></i>搜索
                                            </button>
                                            <a th:href="@{/article/list}" class="btn btn-outline-secondary">
                                                <i class="bi bi-x-lg"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <!-- 操作结果提示 -->
        <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:if="${param.msg[0] == 'deleted'}">文章已成功删除！</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:if="${param.error[0] == 'forbidden'}">操作失败：您没有权限删除该文章，或文章不存在。</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 文章列表 -->
        <div th:if="${#lists.isEmpty(articles)}" class="empty-state">
            <i class="bi bi-inbox"></i>
            <h4 class="text-muted mb-2">暂无文章</h4>
            <p class="text-muted mb-3">快来发布第一篇文章吧！</p>
            <a href="/article/form" class="btn btn-primary btn-lg mt-2" sec:authorize="isAuthenticated()">
                <i class="bi bi-pencil-square me-2"></i>立即创作
            </a>
        </div>

        <div th:each="article : ${articles}" class="article-card card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-lg-9 col-md-8">
                        <h5 class="mb-2">
                            <a th:href="@{/article/{id}(id=${article.id})}"
                               class="article-title-link"
                               th:text="${article.title}">
                                标题
                            </a>
                        </h5>
                        <p class="card-text mb-2">
                            <span th:text="${#strings.abbreviate(article.content, 180)}">内容预览...</span>
                        </p>
                        <div class="article-meta">
                            <span class="meta-item">
                                <i class="bi bi-person-circle"></i>
                                <span class="fw-medium" th:text="${article.author} ?: '匿名'">作者</span>
                            </span>
                            <span class="meta-item">
                                <i class="bi bi-clock"></i>
                                <span th:text="${article.createTime != null ? #dates.format(article.createTime, 'yyyy-MM-dd HH:mm') : '暂无时间'}">时间</span>
                            </span>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-4">
                        <div class="action-buttons">
                            <a th:href="@{/article/edit/{id}(id=${article.id})}"
                               class="btn btn-outline-primary btn-sm"
                               title="编辑">
                                <i class="bi bi-pencil-square me-1"></i> 编辑
                            </a>
                            <a th:if="${article.author == #authentication.name}"
                                th:href="@{/article/delete/{id}(id=${article.id})}"
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('⚠️ 确定要删除这篇文章吗？\n\n此操作不可恢复！');"
                                title="删除">
                                <i class="bi bi-trash me-1"></i> 删除
                            </a>
                        </div>
                        <span th:if="${article.author != #authentication.name}" class="text-muted small mt-2 d-block">
                            <i class="bi bi-lock me-1"></i>只读
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="text-center mt-5">
            <a href="/" class="btn btn-outline-secondary btn-lg px-4">
                <i class="bi bi-house-door me-2"></i>返回首页
            </a>
        </div>
    </div>

    <!-- 悬浮写作按钮 -->
    <a th:if="${#authentication.name}" href="/article/form" class="write-btn" title="写文章">
        <i class="bi bi-pencil-square"></i>
    </a>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
