<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <!-- 引入Bootstrap美化（复制粘贴即可） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <!-- 引入Security方言（必须！） -->
    <html xmlns:th="http://www.thymeleaf.org" 
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        
    <!-- 在container内顶部添加导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="/articles">📝 我的博客</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <!-- 未登录显示 -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">    <!--sec:authorize控制元素显示/隐藏 -->
                        <a class="nav-link" href="/login">🔑 登录</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/auth/register">會員註冊</a>
                    </li>
                    <!-- 已登录显示 -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <!--sec:authentication="principal.username"显示当前用户名-->
                        <span class="nav-link">👤 欢迎, <span sec:authentication="principal.username"></span></span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/logout">🚪 注销</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="btn btn-success btn-sm" href="/article/form">✍️ 写文章</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">📝 博客列表</h1>
        <a href="/article/form" class="btn btn-success btn-lg">
            <i class="bi bi-pencil-square me-1"></i>✍️ 写文章
        </a>
    </div>
    
    <div class="card mb-3" th:each="article : ${articleList}">
        <div class="card-body">
            <h5 class="card-title">
                <a th:href="@{/article/{id}(id=${article.id})}" 
                class="text-decoration-none text-dark fw-bold fs-5" 
                th:text="${article.title}">
                    标题
                </a>
            </h5>
            <p class="card-text" th:text="${article.content}">内容</p>
            <small class="text-muted d-block mt-2">
                👤 作者：<span th:text="${article.author} ?: '匿名'">作者</span> | 
                📅 <span th:text="${article.createTime != null ? #dates.format(article.createTime, 'yyyy-MM-dd HH:mm') : '暂无时间'}">时间</span>
            </small>
        </div>
    </div>
    
    <a href="/" class="btn btn-primary">🏠 首页</a>
</body>
</html>
