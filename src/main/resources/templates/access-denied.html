<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被拒绝</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e74a3b 0%, #f5576c 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* 背景装饰圆圈 */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }
        
        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }
        
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            animation-delay: -3s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .error-card {
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.6s ease;
            max-width: 500px;
            margin: 0 auto;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .error-icon {
            background: linear-gradient(135deg, #e74a3b 0%, #f5576c 100%);
            padding: 3rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-icon i {
            font-size: 6rem;
            color: white;
            animation: shake 2s ease infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(-10deg); }
            20%, 40%, 60%, 80% { transform: rotate(10deg); }
        }
        
        .error-body {
            padding: 2.5rem 2rem;
            background: white;
        }
        
        .error-title {
            font-weight: 800;
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        
        .error-message {
            color: #7f8c8d;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .btn-custom {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .btn-custom-secondary {
            background: white;
            border: 2px solid #e8ecef;
            color: #7f8c8d;
        }
        
        .btn-custom-secondary:hover {
            background: #f8f9fa;
            border-color: #bdc3c7;
            color: #2c3e50;
        }
        
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .back-home:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }
        
        .permission-info {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .permission-info h6 {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .permission-info h6 i {
            color: #667eea;
        }
        
        .permission-info p {
            color: #7f8c8d;
            margin-bottom: 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <!-- 返回首页链接 -->
    <a href="/" class="back-home">
        <i class="bi bi-house"></i> 返回首页
    </a>
    
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-slash-circle"></i>
            </div>
            <div class="error-body">
                <h2 class="error-title">🚫 访问被拒绝</h2>
                <p class="error-message">
                    抱歉，您没有权限访问此页面。<br>
                    请联系管理员获取相应权限。
                </p>
                
                <div class="permission-info">
                    <h6><i class="bi bi-lightbulb me-2"></i>提示</h6>
                    <p class="mb-0">
                        如果您认为这是一个错误，或者需要访问此页面，请联系系统管理员为您分配相应的权限。
                    </p>
                </div>
                
                <div class="error-actions mt-4">
                    <a href="/" class="btn btn-custom btn-custom-primary">
                        <i class="bi bi-house"></i> 返回首页
                    </a>
                    <button onclick="history.back()" class="btn btn-custom btn-custom-secondary">
                        <i class="bi bi-arrow-left"></i> 返回上一页
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
